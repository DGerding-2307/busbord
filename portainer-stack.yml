# Plak dit in Portainer > Stacks > Add stack > Web editor
services:
  busbord:
    image: node:20-alpine
    container_name: busbord
    restart: unless-stopped
    working_dir: /app
    command: node server.js
    environment:
      - TZ=Europe/Amsterdam
      - PORT=8080
      - DATA_DIR=/app/data
      - BUSBORD_USER=rodekruis
      - BUSBORD_PASSWORD=verander-dit-wachtwoord
    ports:
      - "8085:8080"
    volumes:
      - /mnt/user/appdata/busbord:/app
