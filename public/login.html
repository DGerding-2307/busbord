<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<title>Inloggen · Voertuigenbord logistiek</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700;800&display=swap">
<style>
:root{--red:#DC281E;--ocean:#2B6A7F;--sand:#AF8C5F;--stone:#5A5F64;--pearl:#F8F2E3;--bg:#F4F5F5;--surface:#FFFFFF;--line:#D9D9D9;--fg:#1B1F21;--muted:#5A5F64;color-scheme:light}
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.4 "Source Sans 3","Segoe UI",Arial,sans-serif;display:flex;flex-direction:column;align-items:center;padding:max(24px,env(safe-area-inset-top)) 16px 24px}
.card{width:min(400px,100%);background:var(--surface);border:1px solid var(--line);border-top:6px solid var(--ocean);margin-top:6vh}
.head{display:flex;align-items:center;gap:14px;padding:18px 20px;border-bottom:1px dotted var(--stone)}
.head img{height:48px;width:auto;display:block}
.head div{border-left:1px dotted var(--stone);padding-left:14px}
h1{margin:0;font-size:21px;font-weight:800;color:var(--ocean);line-height:1.1}
.head p{margin:2px 0 0;color:var(--muted);font-size:14px}
form{padding:18px 20px 20px;display:grid;gap:14px}
label{display:grid;gap:4px;font-size:12px;text-transform:uppercase;letter-spacing:.07em;font-weight:700;color:var(--muted)}
input{font:inherit;font-size:17px;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:2px;padding:10px 12px;min-height:48px;text-transform:none;letter-spacing:0}
input:focus{outline:none;border-color:var(--ocean);box-shadow:0 0 0 2px color-mix(in srgb,var(--ocean) 25%,transparent)}
button{font:inherit;font-weight:700;font-size:17px;min-height:50px;border:0;border-radius:2px;background:var(--ocean);color:#fff;cursor:pointer}
button[disabled]{opacity:.6}
.err{margin:0;color:var(--red);font-weight:700;min-height:1.4em}
.foot{margin-top:16px;color:var(--muted);font-size:13px;text-align:center;max-width:400px}
.sq{display:inline-block;width:8px;height:8px;background:var(--sand);margin-right:6px;vertical-align:1px}
</style>
</head>

<p class="foot"><span class="sq"></span>Heb je een inlog-QR-code? Scan hem met de camera van je telefoon. Geen account of wachtwoord vergeten? Vraag het aan de teamleider.</p>
<script>
const f=document.getElementById('f'), e=document.getElementById('e'), b=document.getElementById('b');
f.addEventListener('submit', async ev=>{
  ev.preventDefault(); e.textContent=''; b.disabled=true; b.textContent='Bezig…';
  try{
    const r = await fetch('api/login',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:JSON.stringify({gebruikersnaam:document.getElementById('u').value,wachtwoord:document.getElementById('p').value})});
    const j = await r.json().catch(()=>({}));
    if (r.ok){ location.href='./'; return; }
    e.textContent = j.error || 'Inloggen lukte niet.';
  }catch(_){ e.textContent='Geen verbinding met de server.'; }
  b.disabled=false; b.textContent='Inloggen';
});
if (location.hash==='#qr-ongeldig') e.textContent='Deze QR-code werkt niet (meer). Log in met je wachtwoord of vraag een nieuwe code aan de admin.';
